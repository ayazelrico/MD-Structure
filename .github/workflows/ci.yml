name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run full test suite (zero dependencies)
        run: npm run test:verbose
      - name: Smoke test CLI & JSON schemas
        run: |
          node bin/md-structure.js catalog --json > /dev/null
          node bin/md-structure.js analyze --profile examples/saas-platform-idea.json --json > /dev/null
          node bin/md-structure.js scan --dir . --json > /dev/null
